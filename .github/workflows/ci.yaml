name: Harness CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1
        with:
          k6-version: '2.1.0'
          browser: false
      - run: make test inspect
